plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation project(':modules:shared')
    implementation project(':modules:api')

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    
    // Micrometer Prometheus for metrics exposition
    implementation 'io.micrometer:micrometer-registry-prometheus'
    
    // Lettuce client for async Redis operations
    implementation 'io.lettuce:lettuce-core'
    
    // Spring Cloud AWS for SQS integration
    implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:3.1.0')
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-sqs'
    
    // AWS SDK v2 for Textract, Bedrock, and SES
    implementation platform('software.amazon.awssdk:bom:2.20.0')
    implementation 'software.amazon.awssdk:textract'
    implementation 'software.amazon.awssdk:bedrockruntime'
    implementation 'software.amazon.awssdk:ses'
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:kms'
    implementation 'software.amazon.awssdk:secretsmanager'
    
    // Jackson for JSON serialization
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    
    // PostgreSQL driver
    runtimeOnly 'org.postgresql:postgresql'
    
    // Structured JSON logging with Logback
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
    
    // AWS X-Ray SDK for distributed tracing
    implementation 'com.amazonaws:aws-xray-recorder-sdk-core:2.15.1'
    implementation 'com.amazonaws:aws-xray-recorder-sdk-spring:2.15.1'
    implementation 'com.amazonaws:aws-xray-recorder-sdk-aws-sdk-v2:2.15.1'
    implementation 'com.amazonaws:aws-xray-recorder-sdk-aws-sdk-v2-instrumentor:2.15.1'
    
    // AspectJ for SQS message tracing interceptor
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'net.jqwik:jqwik:1.9.0'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.wiremock:wiremock-standalone:3.3.1'
    testRuntimeOnly 'com.h2database:h2'
}
