# Workers Application Configuration
# This module processes async jobs via SQS and scheduled tasks
# No HTTP endpoints are exposed (Spring MVC is disabled)

# Application name
spring.application.name=food-cost-calculator-workers

# AWS Region
aws.region=${AWS_REGION:us-east-1}

# ===========================
# Database Configuration
# ===========================
# Aurora PostgreSQL connection (injected via Secrets Manager in production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/foodcost}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===========================
# Spring Batch Configuration
# ===========================
# Use the same datasource for batch metadata tables
spring.batch.jdbc.initialize-schema=always
# Prevent automatic job execution on startup (jobs are SQS/schedule-triggered)
spring.batch.job.enabled=false

# ===========================
# Spring Cloud AWS SQS
# ===========================
# Queue URLs (injected from environment in EKS deployment)
sqs.queue.cost-propagation=${SQS_COST_PROPAGATION_QUEUE:https://sqs.us-east-1.amazonaws.com/123456789012/cost-propagation.fifo}
sqs.queue.square-sync=${SQS_SQUARE_SYNC_QUEUE:https://sqs.us-east-1.amazonaws.com/123456789012/square-sync.fifo}
sqs.queue.ocr-processing=${SQS_OCR_PROCESSING_QUEUE:https://sqs.us-east-1.amazonaws.com/123456789012/ocr-processing.fifo}
sqs.queue.ai-insights=${SQS_AI_INSIGHTS_QUEUE:https://sqs.us-east-1.amazonaws.com/123456789012/ai-insights.fifo}

# SQS listener configuration
spring.cloud.aws.sqs.enabled=true
# Acknowledge mode: AUTO (message deleted on successful processing)
spring.cloud.aws.sqs.listener.acknowledgement-mode=AUTO
# Fail on missing destination: true (fail fast if queue doesn't exist)
spring.cloud.aws.sqs.listener.fail-on-missing-queue=true

# ===========================
# Redis Configuration
# ===========================
# ElastiCache Redis connection (injected from environment in EKS)
redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASSWORD:}

# ===========================
# AWS Service Configuration
# ===========================
# Textract (Invoice OCR)
aws.textract.confidence-threshold=0.80

# Bedrock (AI Insights)
aws.bedrock.model-id=anthropic.claude-3-sonnet-20240229-v1:0
aws.bedrock.max-tokens=4096
aws.bedrock.temperature=0.7

# SES (Email Notifications)
aws.ses.from-email=${SES_FROM_EMAIL:noreply@cogschecker.com}
aws.ses.from-name=Cogs Checker Food Cost Calculator

# Square POS Configuration
square.oauth.secret-name=${SQUARE_OAUTH_SECRET_NAME:food-cost-calculator/square-oauth}
square.environment=${SQUARE_ENVIRONMENT:sandbox}

# KMS Configuration
aws.kms.square-token-key-id=${KMS_SQUARE_TOKEN_KEY_ID:}

# ===========================
# Actuator / Health Checks
# ===========================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
management.health.db.enabled=true
# Kubernetes liveness and readiness probes
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ===========================
# Logging Configuration
# ===========================
logging.level.root=INFO
logging.level.com.cogschecker.foodcost=DEBUG
logging.level.io.awspring.cloud.sqs=DEBUG
logging.level.org.springframework.batch=INFO
logging.level.software.amazon.awssdk=WARN

# JSON structured logging for CloudWatch
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===========================
# Scheduling Configuration
# ===========================
# Scheduled job cron expressions (UTC timezone)
scheduling.square-sync.cron=${SQUARE_SYNC_CRON:0 0 2 * * ?}
# Daily at 2:00 AM UTC
scheduling.ai-insights.cron=${AI_INSIGHTS_CRON:0 0 3 * * ?}
# Daily at 3:00 AM UTC
