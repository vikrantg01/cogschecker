plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation project(':modules:shared')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // Micrometer Prometheus for metrics exposition
    implementation 'io.micrometer:micrometer-registry-prometheus'
    
    // Database
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    
    // AWS SQS
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-sqs:3.1.0'
    
    // AWS S3
    implementation 'software.amazon.awssdk:s3'
    
    // JWT for Cognito
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    
    // AWS Cognito SDK for authentication operations
    implementation platform('software.amazon.awssdk:bom:2.20.0')
    implementation 'software.amazon.awssdk:cognitoidentityprovider'
    implementation 'software.amazon.awssdk:kms'
    implementation 'software.amazon.awssdk:secretsmanager'
    
    // Stripe for subscription billing
    implementation 'com.stripe:stripe-java:24.0.0'
    
    // Structured JSON logging with Logback
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
    
    // AWS X-Ray SDK for distributed tracing
    implementation 'com.amazonaws:aws-xray-recorder-sdk-core:2.15.1'
    implementation 'com.amazonaws:aws-xray-recorder-sdk-spring:2.15.1'
    implementation 'com.amazonaws:aws-xray-recorder-sdk-aws-sdk-v2:2.15.1'
    implementation 'com.amazonaws:aws-xray-recorder-sdk-aws-sdk-v2-instrumentor:2.15.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    
    // Property-based testing
    testImplementation 'net.jqwik:jqwik:1.8.2'
    
    // Testcontainers for integration testing
    testImplementation 'org.testcontainers:testcontainers:1.19.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.3'
    testImplementation 'org.testcontainers:postgresql:1.19.3'
    testImplementation 'org.testcontainers:localstack:1.19.3'
}
