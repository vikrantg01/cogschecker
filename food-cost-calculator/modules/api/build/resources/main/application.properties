# Spring Boot 3 Virtual Threads Configuration
spring.threads.virtual.enabled=true

# Application metadata
spring.application.name=food-cost-calculator-api

# Profile Configuration
# Use 'local' for development without AWS Cognito (uses mock authentication)
# Use 'dev', 'staging', or 'prod' for real AWS Cognito integration
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server configuration
server.port=8080

# Database configuration (Aurora PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/foodcost}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis configuration (ElastiCache)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# AWS SQS configuration
spring.cloud.aws.region.static=${AWS_REGION:ap-southeast-2}
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:}

# SQS Queue URLs
sqs.queue.cost-propagation=${SQS_COST_PROPAGATION_QUEUE:https://sqs.us-east-1.amazonaws.com/123456789012/cost-propagation.fifo}
sqs.queue.ocr-processing=${SQS_OCR_PROCESSING_QUEUE:https://sqs.us-east-1.amazonaws.com/123456789012/ocr-processing.fifo}

# S3 Configuration
s3.bucket.invoices=${S3_INVOICES_BUCKET:fcc-invoices-dev}

# Cognito JWT configuration
cognito.jwks-uri=${COGNITO_JWKS_URI:https://cognito-idp.ap-southeast-2.amazonaws.com/ap-southeast-2_XXXXX/.well-known/jwks.json}
cognito.domain=${COGNITO_DOMAIN:https://food-cost-calculator.auth.ap-southeast-2.amazoncognito.com}
cognito.user-pool-id=${COGNITO_USER_POOL_ID:ap-southeast-2_XXXXX}
cognito.client-id=${COGNITO_CLIENT_ID:}
cognito.client-secret=${COGNITO_CLIENT_SECRET:}
cognito.redirect-uri=${COGNITO_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth}

# AWS Region
aws.region=${AWS_REGION:ap-southeast-2}

# AWS KMS Configuration
aws.kms.square-token-key-id=${AWS_KMS_SQUARE_TOKEN_KEY_ID:}

# Square OAuth Configuration
square.oauth.secret-name=${SQUARE_OAUTH_SECRET_NAME:fcc-square-oauth-dev}
square.oauth.callback-url=${SQUARE_OAUTH_CALLBACK_URL:http://localhost:8080/api/v1/venues/{venueId}/square/callback}
square.environment=${SQUARE_ENVIRONMENT:sandbox}

# Stripe Configuration
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_test_secret}
stripe.api.key=${STRIPE_API_KEY:sk_test_XXXXX}

# CORS configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# AWS X-Ray Configuration
# Enable/disable X-Ray tracing (enabled by default in non-local environments)
aws.xray.enabled=${AWS_XRAY_ENABLED:true}
# Path to sampling rules (controls which requests to trace)
aws.xray.sampling-rules=classpath:xray-sampling-rules.json
