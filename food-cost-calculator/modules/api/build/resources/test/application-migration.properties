# Migration test configuration - use H2 in-memory database with Flyway enabled
spring.datasource.url=jdbc:h2:mem:migrationdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable Flyway for migration tests
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JPA configuration for migration tests
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Disable Redis for tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Disable AWS for tests
spring.cloud.aws.region.static=ap-southeast-2
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test
