# Test configuration - use H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable Flyway for unit tests
spring.flyway.enabled=false

# JPA configuration for tests
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Redis for tests
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Disable AWS for tests
spring.cloud.aws.region.static=ap-southeast-2
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test

# Test Cognito JWT configuration (will be mocked in tests)
cognito.jwks-uri=https://cognito-idp.ap-southeast-2.amazonaws.com/ap-southeast-2_TEST/.well-known/jwks.json

# AWS KMS Configuration for tests
aws.kms.square-token-key-id=test-key-id

# Square OAuth Configuration for tests
square.oauth.secret-name=test-square-oauth
square.oauth.callback-url=http://localhost:8080/api/v1/venues/{venueId}/square/callback
square.environment=sandbox
