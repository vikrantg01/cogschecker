# Example GitHub Actions Workflow for E2E Tests
# 
# This file shows how to integrate Playwright E2E tests into your CI/CD pipeline.
# Copy the relevant sections into your .github/workflows/ci.yml or deploy.yml file.

name: E2E Tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  e2e-tests:
    name: Run E2E Tests on Staging
    runs-on: ubuntu-latest
    
    # Only run after staging deployment is complete
    needs: [deploy-staging]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: food-cost-calculator/frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: food-cost-calculator/frontend
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: food-cost-calculator/frontend
      
      - name: Get staging URL from CloudFormation
        id: get-staging-url
        run: |
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name FoodCost-ECS-staging \
            --region us-east-1 \
            --query 'Stacks[0].Outputs[?OutputKey==`LoadBalancerDNS`].OutputValue' \
            --output text)
          echo "STAGING_URL=https://${ALB_DNS}" >> $GITHUB_OUTPUT
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      
      - name: Wait for staging to be healthy
        run: |
          echo "Waiting for staging environment to be ready..."
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -sf "${{ steps.get-staging-url.outputs.STAGING_URL }}/api/v1/health" > /dev/null; then
              echo "Staging is healthy!"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts - waiting 10 seconds..."
            sleep 10
          done
          echo "Staging failed to become healthy"
          exit 1
      
      - name: Run E2E tests
        run: BASE_URL=${{ steps.get-staging-url.outputs.STAGING_URL }} npm run test:e2e
        working-directory: food-cost-calculator/frontend
        env:
          CI: true
      
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: food-cost-calculator/frontend/playwright-report/
          retention-days: 30
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: food-cost-calculator/frontend/test-results/
          retention-days: 30
      
      - name: Comment test results on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const testResults = fs.existsSync('food-cost-calculator/frontend/test-results/junit.xml')
              ? 'Test results available in artifacts'
              : 'No test results found';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🎭 E2E Test Results\n\n${testResults}\n\nView the full [Playwright Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            });
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::E2E tests failed! Check the Playwright report for details."

  # Example: Block production deploy if E2E tests fail
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add your production deployment steps here

# Alternative: Run E2E tests against local environment
jobs:
  e2e-tests-local:
    name: Run E2E Tests Locally
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: foodcost_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Build Spring Boot API
        run: ./gradlew :modules:api:bootJar
        working-directory: food-cost-calculator
      
      - name: Start API server
        run: |
          java -jar modules/api/build/libs/api-*.jar &
          echo $! > api.pid
        working-directory: food-cost-calculator
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/foodcost_test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379
      
      - name: Wait for API to be ready
        run: |
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -sf http://localhost:8080/api/v1/health > /dev/null; then
              echo "API is ready!"
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 2
          done
          echo "API failed to start"
          exit 1
      
      - name: Install frontend dependencies
        run: npm ci
        working-directory: food-cost-calculator/frontend
      
      - name: Start frontend dev server
        run: |
          npm run dev &
          echo $! > frontend.pid
        working-directory: food-cost-calculator/frontend
      
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
        working-directory: food-cost-calculator/frontend
      
      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: food-cost-calculator/frontend
      
      - name: Stop servers
        if: always()
        run: |
          [ -f api.pid ] && kill $(cat api.pid) || true
          [ -f frontend.pid ] && kill $(cat frontend.pid) || true
        working-directory: food-cost-calculator
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report-local
          path: food-cost-calculator/frontend/playwright-report/
