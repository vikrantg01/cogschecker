name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  id-token: write   # Required for OIDC authentication with AWS
  contents: read
  pull-requests: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-2.amazonaws.com
  API_IMAGE_NAME: food-cost-calculator-api
  WORKERS_IMAGE_NAME: food-cost-calculator-workers

jobs:
  test-backend:
    name: Test Backend (Gradle)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./food-cost-calculator

      - name: Run Gradle tests (all modules)
        run: ./gradlew test --no-daemon
        working-directory: ./food-cost-calculator

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Test Results
          path: '**/build/test-results/test/TEST-*.xml'
          reporter: java-junit

  test-frontend:
    name: Test Frontend (Vitest)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './food-cost-calculator/frontend/package-lock.json'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./food-cost-calculator/frontend

      - name: Run Vitest tests
        run: npm run test
        working-directory: ./food-cost-calculator/frontend
        continue-on-error: true  # Don't fail if test script doesn't exist yet

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./food-cost-calculator

      - name: Build API JAR
        run: ./gradlew :modules:api:bootJar --no-daemon
        working-directory: ./food-cost-calculator

      - name: Build Workers JAR
        run: ./gradlew :modules:workers:bootJar --no-daemon
        working-directory: ./food-cost-calculator

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./food-cost-calculator/modules/api
          file: ./food-cost-calculator/modules/api/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Workers image
        uses: docker/build-push-action@v5
        with:
          context: ./food-cost-calculator/modules/workers
          file: ./food-cost-calculator/modules/workers/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.WORKERS_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.WORKERS_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cdk-diff:
    name: CDK Diff
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './infra/package-lock.json'

      - name: Install CDK dependencies
        run: npm ci
        working-directory: ./infra

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run CDK diff
        run: npx cdk diff --app "npx ts-node bin/app.ts" --all
        working-directory: ./infra
        continue-on-error: true  # Diff will exit with non-zero if there are differences

      - name: Comment PR with CDK diff
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### CDK Diff Results
            
            Infrastructure changes will be applied if this PR is merged.
            
            Please review the CDK diff output in the workflow logs.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
